<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Repurposing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 750px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2457a7;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        textarea, select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .platforms {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 12px;
        }

        .platforms label {
            margin-top: 0;
            font-weight: normal;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #2457a7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #173d7a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Multi-Platform Content Repurposing Workflow</h1>
        <p>Transform your original content into content for multiple platforms.</p>

        <form action="/generate" method="POST">
            <label for="content">Enter Your Original Content</label>
            <textarea id="content" name="content"
                placeholder="Enter an article, blog post, or topic..."
                required></textarea>

            <label>Select Platforms</label>
            <div class="platforms">
                <label><input type="checkbox" name="platforms" value="Instagram"> Instagram</label>
                <label><input type="checkbox" name="platforms" value="LinkedIn"> LinkedIn</label>
                <label><input type="checkbox" name="platforms" value="X"> X</label>
                <label><input type="checkbox" name="platforms" value="Facebook"> Facebook</label>
                <label><input type="checkbox" name="platforms" value="YouTube"> YouTube</label>
            </div>

            <label for="tone">Choose Writing Tone</label>
            <select id="tone" name="tone">
                <option value="Professional">Professional</option>
                <option value="Friendly">Friendly</option>
                <option value="Creative">Creative</option>
                <option value="Informative">Informative</option>
            </select>

            <button type="submit">Repurpose My Content</button>
        </form>
    </div>
</body>
</html>
